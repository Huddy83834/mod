name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifesteal-stocks-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lifesteal-stocks-jar
          path: lifesteal-stocks-ci/build/libs/lifesteal-stocks-1.0.0.jar
