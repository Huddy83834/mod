name: build-punishfx

on:
  push:
    paths:
      - 'punishfx-ci/**'
      - '.github/workflows/punishfx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: punishfx-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Find the newest Fabric loader and Fabric API for 1.21.11
        id: ver
        shell: bash
        run: |
          LOADER=$(curl -fsS "https://meta.fabricmc.net/v2/versions/loader/1.21.11" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['loader']['version'])")
          API=$(curl -fsS "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" | grep -o '<version>[^<]*+1\.21\.11</version>' | sed 's/<[^>]*>//g' | tail -1)
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "Using loader $LOADER and Fabric API $API"
      - name: Build
        shell: bash
        run: |
          set +e
          gradle build --no-daemon -Ploader_version=${{ steps.ver.outputs.loader }} "-Pfabric_api_version=${{ steps.ver.outputs.api }}" 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$( (grep -B1 -A3 -E "error:|What went wrong|Could not|FAILED" build.log | head -80) | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build errors::${msg}"
          fi
          exit $code
      - name: Probe new APIs
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          J=""
          for f in $(find / -name "*.jar" -path "*minecraft*" 2>/dev/null | grep -i -E "merged|client" | grep -v sources); do
            if unzip -l "$f" 2>/dev/null | grep -q "net/minecraft/client/Options.class"; then J="$f"; break; fi
          done
          P() { echo "@@@@@ $1"; }
          P "globals.glsl"; unzip -p "$J" assets/minecraft/shaders/include/globals.glsl
          P "box_blur.fsh"; unzip -p "$J" assets/minecraft/shaders/post/box_blur.fsh
          P "blur.json"; unzip -p "$J" assets/minecraft/post_effect/blur.json | head -40
          P "PostChain"; javap -p -cp "$J" net.minecraft.client.renderer.PostChain
          P "PostPass"; javap -p -cp "$J" net.minecraft.client.renderer.PostPass
          P "PostPass strings"; javap -p -c -cp "$J" net.minecraft.client.renderer.PostPass | grep -E "ldc|invoke" | grep -iE "String|Uniform|Globals|bindDefault|setUniform|writeToBuffer" | head -40
          P "PostChain strings"; javap -p -c -cp "$J" net.minecraft.client.renderer.PostChain | grep -E "ldc|invoke" | grep -iE "String|Uniform|Globals|withUniform" | head -40
          P "RenderSystem uniform"; javap -cp "$J" com.mojang.blaze3d.systems.RenderSystem | grep -iE "uniform|global"
          P "CommandEncoder"; javap -cp "$J" com.mojang.blaze3d.systems.CommandEncoder
          P "GameRenderer fields"; javap -p -cp "$J" net.minecraft.client.renderer.GameRenderer | grep -iE "pool|Pool|render\(|renderLevel"
          P "GameRenderer.render invokes"; javap -p -c -cp "$J" net.minecraft.client.renderer.GameRenderer | awk '/ void render\(net.minecraft.client.DeltaTracker, boolean\);/{f=1} f&&/invoke/{print} f&&/^$/{exit}' | head -80
          P "ShaderManager"; javap -cp "$J" net.minecraft.client.renderer.ShaderManager | grep -i post
          P "KeyboardHandler"; javap -cp "$J" net.minecraft.client.KeyboardHandler | grep -i clip
          P "END"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: punishfx-jar
          path: punishfx-ci/build/libs/punishfx-1.6.0.jar
      - name: Install a virtual display
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils > /dev/null
      - name: Run the mod inside a real Minecraft client
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set +e
          # Shared runners sometimes can't load the test world in time; retry only that case.
          for attempt in 1 2 3; do
            xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClientGameTest --no-daemon -Ploader_version=${{ steps.ver.outputs.loader }} "-Pfabric_api_version=${{ steps.ver.outputs.api }}" > gametest.log 2>&1
            code=$?
            if [ "$code" -eq 0 ] || ! grep -q "Timeout loading world" gametest.log; then break; fi
            echo "attempt $attempt: world load timed out on this runner, retrying"
          done
          echo "----- results -----"
          grep -E "PUNISHFX-TEST" gametest.log
          echo "----- problems -----"
          grep -iE "mixin.*(error|fail|could not)|Exception|Caused by|FAILED|OpenGL" gametest.log | grep -v "PUNISHFX-TEST" | head -60
          echo "exit=$code"
          exit $code
      - name: Publish screenshots to the ci-shots branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/shots
          find . -path "*punishfx-shots*" -name "*.png" -exec cp {} /tmp/shots/ \;
          cp gametest.log /tmp/shots/ 2>/dev/null || true
          ls /tmp/shots
          cd /tmp/shots
          git init -q
          git checkout -q -b ci-shots
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "punishfx in-game run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
