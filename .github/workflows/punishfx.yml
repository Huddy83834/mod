name: build-punishfx

on:
  push:
    paths:
      - 'punishfx-ci/**'
      - '.github/workflows/punishfx.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: punishfx-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Find the newest Fabric loader and Fabric API for 1.21.11
        id: ver
        shell: bash
        run: |
          LOADER=$(curl -fsS "https://meta.fabricmc.net/v2/versions/loader/1.21.11" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['loader']['version'])")
          API=$(curl -fsS "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" | grep -o '<version>[^<]*+1\.21\.11</version>' | sed 's/<[^>]*>//g' | tail -1)
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "Using loader $LOADER and Fabric API $API"
      - name: Build
        shell: bash
        run: |
          set +e
          gradle build --no-daemon -Ploader_version=${{ steps.ver.outputs.loader }} "-Pfabric_api_version=${{ steps.ver.outputs.api }}" 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$( (grep -B1 -A3 -E "error:|What went wrong|Could not|FAILED" build.log | head -80) | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build errors::${msg}"
          fi
          exit $code
      - name: Probe game classes
        if: always()
        shell: bash
        run: |
          J=""
          for f in $(find / -name "*.jar" -path "*minecraft*" 2>/dev/null | grep -i -E "merged|client" | grep -v sources); do
            if unzip -l "$f" 2>/dev/null | grep -q "net/minecraft/client/Minecraft.class"; then J="$f"; echo "JAR $f"; break; fi
          done
          [ -z "$J" ] && echo "no jar found" && exit 0
          for c in net.minecraft.client.player.Input net.minecraft.client.player.KeyboardInput net.minecraft.client.player.ClientInput net.minecraft.client.player.LocalPlayer net.minecraft.client.Minecraft net.minecraft.client.Options net.minecraft.world.effect.MobEffects net.minecraft.world.effect.MobEffectInstance net.minecraft.world.entity.LivingEntity net.minecraft.client.multiplayer.ClientPacketListener net.minecraft.network.Connection net.minecraft.client.gui.screens.TitleScreen net.minecraft.client.gui.screens.DisconnectedScreen net.minecraft.client.renderer.GameRenderer net.minecraft.client.KeyMapping net.minecraft.world.entity.Entity; do
            echo "===== $c"
            javap -cp "$J" "$c" 2>&1 | grep -v -E "lambda\$|static \{|\\$[0-9]" | head -90
          done
      - uses: actions/upload-artifact@v4
        with:
          name: punishfx-jar
          path: punishfx-ci/build/libs/punishfx-1.0.0.jar
