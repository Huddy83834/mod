name: build-punishfx

on:
  push:
    paths:
      - 'punishfx-ci/**'
      - '.github/workflows/punishfx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: punishfx-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Find the newest Fabric loader and Fabric API for 1.21.11
        id: ver
        shell: bash
        run: |
          LOADER=$(curl -fsS "https://meta.fabricmc.net/v2/versions/loader/1.21.11" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d[0]['loader']['version'])")
          API=$(curl -fsS "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" | grep -o '<version>[^<]*+1\.21\.11</version>' | sed 's/<[^>]*>//g' | tail -1)
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "Using loader $LOADER and Fabric API $API"
      - name: Build
        shell: bash
        run: |
          set +e
          gradle build --no-daemon -Ploader_version=${{ steps.ver.outputs.loader }} "-Pfabric_api_version=${{ steps.ver.outputs.api }}" 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$( (grep -B1 -A3 -E "error:|What went wrong|Could not|FAILED" build.log | head -80) | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build errors::${msg}"
          fi
          exit $code
      - name: Probe new APIs
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          J=""
          for f in $(find / -name "*.jar" -path "*minecraft*" 2>/dev/null | grep -i -E "merged|client" | grep -v sources); do
            if unzip -l "$f" 2>/dev/null | grep -q "net/minecraft/client/Options.class"; then J="$f"; break; fi
          done
          P() { echo "@@@@@ $1"; }
          P "GameRenderer post"; javap -p -cp "$J" net.minecraft.client.renderer.GameRenderer 2>&1 | grep -iE "post|effect" | head -20
          P "post_effect files"; unzip -l "$J" | grep -E "assets/minecraft/post_effect/" | awk '{print $4}'
          P "post shaders"; unzip -l "$J" | grep -E "assets/minecraft/shaders/post/" | awk '{print $4}'
          for f in post_effect/invert.json post_effect/spider.json shaders/post/invert.fsh shaders/post/blit.fsh shaders/post/sobel.vsh shaders/post/blit.vsh shaders/post/screenquad.vsh; do P "FILE $f"; unzip -p "$J" "assets/minecraft/$f" 2>/dev/null | head -60; done
          P "CameraType"; javap -cp "$J" net.minecraft.client.CameraType 2>&1 | head; javap -cp "$J" net.minecraft.client.Options 2>&1 | grep -i camera
          P "ClientLanguage"; javap -cp "$J" net.minecraft.client.resources.language.ClientLanguage 2>&1 | grep static
          P "I18n"; javap -cp "$J" net.minecraft.client.resources.language.I18n 2>&1 | grep static
          P "Language"; javap -cp "$J" net.minecraft.locale.Language 2>&1 | grep static
          P "LanguageManager"; javap -cp "$J" net.minecraft.client.resources.language.LanguageManager 2>&1 | grep public
          P "SoundEngine"; javap -p -cp "$J" net.minecraft.client.sounds.SoundEngine 2>&1 | grep -iE "pitch|volume|play\(" | head
          P "SoundManager"; javap -cp "$J" net.minecraft.client.sounds.SoundManager 2>&1 | grep -iE "play" | head
          P "Gui hotbar"; javap -p -cp "$J" net.minecraft.client.gui.Gui 2>&1 | grep -iE "hotbar|slot" | head
          P "Gui hotbar calls"; javap -p -c -cp "$J" net.minecraft.client.gui.Gui 2>&1 | awk '/renderItemHotbar\(/{f=1} f&&/invoke/{print} f&&/^$/{exit}' | grep -iE "renderSlot|getItem|Inventory" | head
          P "Inventory"; javap -cp "$J" net.minecraft.world.entity.player.Inventory 2>&1 | grep -iE "selected|getItem\(int|SLOTS|HOTBAR" | head
          P "LocalPlayer drop"; javap -cp "$J" net.minecraft.client.player.LocalPlayer 2>&1 | grep -iE "drop" | head
          P "Entity turn"; javap -cp "$J" net.minecraft.world.entity.Entity 2>&1 | grep -E " turn\(" | head
          P "ItemStack ctor"; javap -cp "$J" net.minecraft.world.item.ItemStack 2>&1 | grep -E "public net.minecraft.world.item.ItemStack\(" | head
          P "BuiltInRegistries ITEM"; javap -cp "$J" net.minecraft.core.registries.BuiltInRegistries 2>&1 | grep " ITEM;" 
          P "END"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: punishfx-jar
          path: punishfx-ci/build/libs/punishfx-1.3.0.jar
      - name: Install a virtual display
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils > /dev/null
      - name: Run the mod inside a real Minecraft client
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set +e
          # Shared runners sometimes can't load the test world in time; retry only that case.
          for attempt in 1 2 3; do
            xvfb-run -a -s "-screen 0 1920x1080x24" gradle runClientGameTest --no-daemon -Ploader_version=${{ steps.ver.outputs.loader }} "-Pfabric_api_version=${{ steps.ver.outputs.api }}" > gametest.log 2>&1
            code=$?
            if [ "$code" -eq 0 ] || ! grep -q "Timeout loading world" gametest.log; then break; fi
            echo "attempt $attempt: world load timed out on this runner, retrying"
          done
          echo "----- results -----"
          grep -E "PUNISHFX-TEST" gametest.log
          echo "----- problems -----"
          grep -iE "mixin.*(error|fail|could not)|Exception|Caused by|FAILED|OpenGL" gametest.log | grep -v "PUNISHFX-TEST" | head -60
          echo "exit=$code"
          exit $code
      - name: Publish screenshots to the ci-shots branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/shots
          find . -path "*punishfx-shots*" -name "*.png" -exec cp {} /tmp/shots/ \;
          cp gametest.log /tmp/shots/ 2>/dev/null || true
          ls /tmp/shots
          cd /tmp/shots
          git init -q
          git checkout -q -b ci-shots
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "punishfx in-game run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
